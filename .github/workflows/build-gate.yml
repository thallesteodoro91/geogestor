name: Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  forbidden-terms:
    name: Check for forbidden legacy terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run forbidden terms check (case-insensitive)
        run: bash scripts/check-forbidden-terms.sh src/
