name: Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  forbidden-terms:
    name: Check for forbidden legacy terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden terms (SmartImporter)
        run: |
          set -e
          if rg -l SmartImporter src/ --type ts --type tsx 2>/dev/null | grep -q .; then
            echo "::error::Forbidden term 'SmartImporter' found in source files."
            rg -n SmartImporter src/ --type ts --type tsx
            exit 1
          fi
          echo "✅ No forbidden terms found."

      - name: Check for forbidden terms (MappingValidationPanel)
        run: |
          set -e
          if rg -l MappingValidationPanel src/ --type ts --type tsx 2>/dev/null | grep -q .; then
            echo "::error::Forbidden term 'MappingValidationPanel' found in source files."
            rg -n MappingValidationPanel src/ --type ts --type tsx
            exit 1
          fi
          echo "✅ No forbidden terms found."
