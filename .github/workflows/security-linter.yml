name: Supabase Security Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      critical_lint_codes:
        description: "Comma-separated lint codes that MUST fail the build (e.g. 0001,0002,0010,0014)"
        required: false
        default: "0001,0002,0010,0014"

jobs:
  lint:
    name: Run Supabase DB linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      # Always print the full report for visibility (warnings + errors).
      - name: Lint (report all levels)
        continue-on-error: true
        run: supabase db lint --linked --level warning

      # Fail the build ONLY when an ERROR-level finding matches one of the
      # codes in CRITICAL_LINT_CODES. All other findings stay as warnings.
      # Accepted warnings: see mem://security/riscos-aceitos-design.
      - name: Fail on specific critical lint codes
        env:
          # Comma-separated list of lint codes that MUST fail the build.
          # Examples: 0001 (security_definer_view), 0002 (auth_users_exposed),
          # 0010 (rls_disabled_in_public), 0014 (rls_references_user_metadata).
          # Adjust this list to match your project's risk tolerance.
          CRITICAL_LINT_CODES: ${{ github.event.inputs.critical_lint_codes || vars.CRITICAL_LINT_CODES || '0001,0002,0010,0014' }}
        run: |
          set -e

          # Normalize input: trim spaces, drop empty entries, dedupe.
          NORMALIZED=$(echo "$CRITICAL_LINT_CODES" \
            | tr ',' '\n' \
            | sed 's/[[:space:]]//g' \
            | grep -v '^$' \
            | sort -u \
            | paste -sd ',' -)

          if [ -z "$NORMALIZED" ]; then
            echo "::warning::CRITICAL_LINT_CODES is empty after normalization — skipping critical-code gate."
            exit 0
          fi

          echo "Using critical lint codes: [$NORMALIZED]"

          OUTPUT=$(supabase db lint --linked --level error || true)
          echo "$OUTPUT"

          # Build regex like: lint=(0001|0002|0010|0014)
          PATTERN=$(echo "$NORMALIZED" | sed 's/,/|/g')
          REGEX="lint=(${PATTERN})\\b"

          MATCHES=$(echo "$OUTPUT" | grep -oE "$REGEX" | sort -u || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Critical security findings detected matching codes: $MATCHES"
            echo "$OUTPUT" | grep -E "$REGEX|^(ERROR|WARN)" || true
            exit 1
          fi
          echo "✅ No critical findings matching codes [$NORMALIZED]."
