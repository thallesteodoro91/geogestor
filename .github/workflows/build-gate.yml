name: Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  forbidden-terms:
    name: Check for forbidden legacy terms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden terms (SmartImporter — case-insensitive)
        run: |
          set -e
          if rg -il smartimporter src/ --type ts --type tsx 2>/dev/null | grep -q .; then
            echo "::error::Forbidden term 'smartimporter' (case-insensitive) found in source files."
            rg -in smartimporter src/ --type ts --type tsx
            exit 1
          fi
          echo "✅ No forbidden terms found."

      - name: Check for forbidden terms (MappingValidationPanel — case-insensitive)
        run: |
          set -e
          if rg -il mappingvalidationpanel src/ --type ts --type tsx 2>/dev/null | grep -q .; then
            echo "::error::Forbidden term 'mappingvalidationpanel' (case-insensitive) found in source files."
            rg -in mappingvalidationpanel src/ --type ts --type tsx
            exit 1
          fi
          echo "✅ No forbidden terms found."
